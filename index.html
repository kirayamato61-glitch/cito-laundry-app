<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITO Laundry Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cito: { teal: '#009ca6', pink: '#e6007e', orange: '#f5a623' }
                    }
                }
            }
        }
    </script>
    <style>
        .hidden-menu { display: none; }
        .active-menu { display: block; }
        .stepper-item.completed .step-counter { background-color: #009ca6; color: white; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-cito-teal p-4">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md text-center">
            <h1 class="text-4xl font-black text-cito-teal italic tracking-tighter mb-2">CITO</h1>
            <h2 class="text-xl font-bold text-gray-700 mb-1">LAUNDRY EXPRESS</h2>
            <p class="text-sm font-bold text-cito-pink mb-8 bg-pink-50 py-1 rounded-full">#GetCleanGetGoing</p>
            
            <input type="text" id="username" placeholder="Username (e.g., admin)" class="w-full border-2 border-gray-200 rounded-lg p-3 mb-4 focus:border-cito-teal outline-none">
            <input type="password" id="pin" placeholder="PIN" class="w-full border-2 border-gray-200 rounded-lg p-3 mb-6 focus:border-cito-teal outline-none">
            
            <button onclick="handleLogin()" class="w-full bg-cito-teal text-white font-bold py-3 rounded-lg hover:bg-teal-600 transition shadow-lg">LOGIN</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- Top Mobile Header & Desktop Sidebar -->
        <header class="bg-white shadow-md p-4 flex justify-between items-center md:w-64 md:flex-col md:justify-start md:h-screen md:fixed z-50">
            <div class="flex items-center justify-between w-full md:mb-8">
                <div class="flex items-center gap-2">
                    <button onclick="toggleMenu()" class="md:hidden text-gray-600 focus:outline-none">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <span class="text-2xl font-black text-cito-teal italic tracking-tighter">CITO</span>
                </div>
            </div>

            <!-- Navigation Menu -->
            <nav id="nav-menu" class="hidden-menu absolute top-16 left-0 w-full bg-white shadow-lg md:shadow-none md:static md:block md:w-full">
                <ul class="flex flex-col gap-2 p-4 md:p-0">
                    <li><button onclick="switchTab('dashboard')" class="w-full text-left p-3 rounded-lg font-bold text-gray-600 hover:bg-teal-50 hover:text-cito-teal">Dashboard</button></li>
                    <li><button onclick="switchTab('orders')" class="w-full text-left p-3 rounded-lg font-bold text-gray-600 hover:bg-teal-50 hover:text-cito-teal">Orders</button></li>
                    <li id="nav-register"><button onclick="switchTab('register')" class="w-full text-left p-3 rounded-lg font-bold text-gray-600 hover:bg-teal-50 hover:text-cito-teal">Cash Register</button></li>
                    <li id="nav-finance"><button onclick="switchTab('finance')" class="w-full text-left p-3 rounded-lg font-bold text-gray-600 hover:bg-teal-50 hover:text-cito-teal">Finance</button></li>
                </ul>
                <div class="p-4 md:p-0 md:mt-auto border-t mt-4 md:border-none">
                    <select id="lang-select" onchange="changeLanguage()" class="mb-4 w-full p-2 border rounded text-sm outline-none">
                        <option value="id">Bahasa Indonesia</option>
                        <option value="en">English</option>
                    </select>
                    <button onclick="logout()" class="w-full bg-red-100 text-red-600 font-bold py-2 rounded-lg">Logout</button>
                </div>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:ml-64 bg-gray-50 h-screen overflow-y-auto">
            
            <!-- Dashboard Tab -->
            <div id="tab-dashboard" class="tab-content active-menu">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800" id="dash-title">Dashboard</h2>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <button onclick="openModal('modal-new-order')" class="bg-cito-teal text-white p-4 rounded-xl shadow font-bold flex flex-col items-center justify-center hover:bg-teal-600">
                        <span class="text-2xl mb-1">+</span> New Order
                    </button>
                    <button onclick="openModal('modal-expense')" class="bg-cito-pink text-white p-4 rounded-xl shadow font-bold flex flex-col items-center justify-center hover:bg-pink-600">
                        <span class="text-2xl mb-1">-</span> Add Expense
                    </button>
                    <button onclick="openModal('modal-wa-template')" class="bg-green-500 text-white p-4 rounded-xl shadow font-bold flex flex-col items-center justify-center hover:bg-green-600">
                        <span class="text-xl mb-1">WA</span> Template
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow p-4">
                    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2 border-cito-teal">Recent Activity</h3>
                    <div id="activity-feed" class="text-sm text-gray-500 italic">Waiting for database sync...</div>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="tab-orders" class="tab-content hidden-menu">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Active Orders</h2>
                <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 1. YOUR LIVE FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDgzs_FDquRHfwUgiSb0lqTQ-2A8kdMxm0",
            authDomain: "cito-laundry-app.firebaseapp.com",
            projectId: "cito-laundry-app",
            storageBucket: "cito-laundry-app.firebasestorage.app",
            messagingSenderId: "296023527014",
            appId: "1:296023527014:web:6a4cae0aca5207b95ee7a7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 2. SHARED MASTER DATABASE PATH
        const MASTER_DB_PATH = "cito_master_database";

        // Make global functions available to HTML onclick handlers
        window.toggleMenu = () => {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden-menu');
            menu.classList.toggle('active-menu');
        };

        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden-menu'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active-menu'));
            const activeTab = document.getElementById(`tab-${tabId}`);
            if(activeTab) {
                activeTab.classList.remove('hidden-menu');
                activeTab.classList.add('active-menu');
            }
            if(window.innerWidth < 768) window.toggleMenu();
        };

        window.handleLogin = async () => {
            const user = document.getElementById('username').value.toLowerCase();
            const pin = document.getElementById('pin').value;
            
            if (user === 'admin' && pin === '1234') {
                try {
                    await signInAnonymously(auth);
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    startDatabaseSync();
                } catch (error) {
                    alert("Authentication Failed: " + error.message);
                }
            } else {
                alert("Invalid Credentials");
            }
        };

        window.logout = () => {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('pin').value = '';
        };

        window.formatPhoneNumber = (phone) => {
            let cleaned = phone.replace(/\D/g, '');
            if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
            if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
            return cleaned;
        };

        function startDatabaseSync() {
            // Pointing directly to the shared folder so all devices see the same data
            const ordersRef = collection(db, "stores", MASTER_DB_PATH, "orders");
            
            onSnapshot(ordersRef, (snapshot) => {
                const feed = document.getElementById('activity-feed');
                if(snapshot.empty) {
                    feed.innerHTML = "Tidak ada pesanan aktif (No active orders).";
                    return;
                }
                feed.innerHTML = "";
                snapshot.forEach(doc => {
                    feed.innerHTML += `<div class="p-2 border-b">Order ID: ${doc.id} - Synced from Cloud!</div>`;
                });
            }, (error) => {
                console.error("Sync Error:", error);
                document.getElementById('activity-feed').innerHTML = "Database Connection Error: " + error.message;
            });
        }
    </script>
</body>
</html>
